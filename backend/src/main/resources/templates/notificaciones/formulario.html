<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<div th:replace="~{fragments/head :: head(${titulo})}"></div>
<body>
    <div class="container">
        <div th:replace="~{fragments/navbar :: navbar}"></div>

        <main>
            <section class="page-header">
                <div>
                    <h2 th:text="${modoEdicion} ? 'Editar notificación' : 'Crear nueva notificación'">Notificación</h2>
                    <p>Completa la información del aviso o recordatorio.</p>
                </div>

                <div class="actions">
                    <a th:href="@{/notificaciones}" class="btn btn-outline">Volver al listado</a>
                </div>
            </section>

            <section class="card form-card">
                <form th:action="@{/notificaciones/guardar}" th:object="${notificacion}" method="post" class="form-grid">
                    <input type="hidden" th:field="*{id}">

                    <div class="form-group">
                        <label for="tipo">Tipo de notificación</label>
                        <select id="tipo" th:field="*{tipo}" class="select" required>
                            <option value="">Selecciona un tipo</option>
                            <option th:each="tipo : ${tipos}"
                                    th:value="${tipo}"
                                    th:text="${tipo}">
                            </option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="mensaje">Mensaje</label>
                        <textarea id="mensaje" th:field="*{mensaje}" class="textarea" placeholder="Escribe el mensaje de la notificación" required></textarea>
                    </div>

                    <div class="form-group">
                        <label for="fechaHora">Fecha y hora</label>
                        <input id="fechaHora" type="datetime-local" th:field="*{fechaHora}" class="input" required>
                    </div>

                    <div class="form-group">
                        <label for="leida">Estado de lectura</label>
                        <select id="leida" th:field="*{leida}" class="select" required>
                            <option th:value="false">No leída</option>
                            <option th:value="true">Leída</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="usuario">Usuario destinatario</label>
                        <select id="usuario" name="usuario" class="select" required>
                            <option value="">Selecciona un usuario</option>
                            <option th:each="usuario : ${usuarios}"
                                    th:value="${usuario.id}"
                                    th:text="${usuario.nombreCompleto + ' - ' + usuario.rol}"
                                    th:selected="${notificacion.usuario != null and notificacion.usuario.id == usuario.id}">
                            </option>
                        </select>
                    </div>

                    <div class="actions">
                        <button type="submit" class="btn btn-primary" th:text="${modoEdicion} ? 'Actualizar notificación' : 'Guardar notificación'">
                            Guardar notificación
                        </button>
                        <a th:href="@{/notificaciones}" class="btn btn-outline">Cancelar</a>
                    </div>
                </form>
            </section>
        </main>
    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
