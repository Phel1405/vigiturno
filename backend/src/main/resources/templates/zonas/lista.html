<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<div th:replace="~{fragments/head :: head(${titulo})}"></div>
<body>
    <div class="container">
        <div th:replace="~{fragments/navbar-admin :: navbarAdmin}"></div>

        <main>
            <section class="page-header">
                <div>
                    <h2>Listado de zonas</h2>
                    <p>Administra las zonas de vigilancia y supervisión del colegio.</p>
                </div>

                <div class="actions">
                    <a th:href="@{/zonas/nueva}" class="btn btn-primary">Nueva zona</a>
                </div>
            </section>

            <section class="card table-card">
                <div class="table-title">
                    <h2>Zonas registradas</h2>
                </div>

                <table class="table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nombre</th>
                            <th>Descripción</th>
                            <th>Capacidad máxima</th>
                            <th>Estado</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:if="${#lists.isEmpty(zonas)}">
                            <td colspan="6">No hay zonas registradas todavía.</td>
                        </tr>

                        <tr th:each="zona : ${zonas}">
                            <td th:text="${zona.id}"></td>
                            <td th:text="${zona.nombre}"></td>
                            <td th:text="${zona.descripcion}"></td>
                            <td th:text="${zona.capacidadMaxima}"></td>
                            <td>
                                <span th:if="${zona.activa}" class="badge badge-success">Activa</span>
                                <span th:unless="${zona.activa}" class="badge badge-danger">Inactiva</span>
                            </td>
                            <td>
                                <div class="actions">
                                    <a th:href="@{'/zonas/editar/' + ${zona.id}}" class="btn btn-outline">Editar</a>
                                    <a th:href="@{'/zonas/eliminar/' + ${zona.id}}" class="btn btn-outline"
                                       onclick="return confirm('¿Seguro que deseas eliminar esta zona?');">
                                        Eliminar
                                    </a>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </section>
        </main>
    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
