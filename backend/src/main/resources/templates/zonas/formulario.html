<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<div th:replace="~{fragments/head :: head(${modoEdicion} ? 'Editar zona' : 'Nueva zona')}"></div>
<body>
    <div class="container">
        <div th:replace="~{fragments/navbar-admin :: navbarAdmin}"></div>

        <main>
            <section class="page-header">
                <div>
                    <h2 th:text="${modoEdicion} ? 'Editar zona' : 'Crear nueva zona'">Zona</h2>
                    <p>Completa la información básica de la zona.</p>
                </div>

                <div class="actions">
                    <a th:href="@{/zonas}" class="btn btn-outline">Volver al listado</a>
                </div>
            </section>

            <section class="card form-card">
                <form th:action="@{/zonas/guardar}" th:object="${zona}" method="post" class="form-grid">
                    <input type="hidden" th:field="*{id}">

                    <div class="form-group">
                        <label for="nombre">Nombre</label>
                        <input id="nombre" type="text" th:field="*{nombre}" class="input" required>
                    </div>

                    <div class="form-group">
                        <label for="descripcion">Descripción</label>
                        <textarea id="descripcion" th:field="*{descripcion}" class="textarea"></textarea>
                    </div>

                    <div class="form-group">
                        <label for="capacidadMaxima">Capacidad máxima</label>
                        <input id="capacidadMaxima" type="number" th:field="*{capacidadMaxima}" class="input" min="0">
                    </div>

                    <div class="form-group">
                        <label for="activa">Estado</label>
                        <select id="activa" th:field="*{activa}" class="select" required>
                            <option th:value="true">Activa</option>
                            <option th:value="false">Inactiva</option>
                        </select>
                    </div>

                    <div class="actions">
                        <button type="submit" class="btn btn-primary"
                                th:text="${modoEdicion} ? 'Actualizar zona' : 'Guardar zona'}"></button>
                        <a th:href="@{/zonas}" class="btn btn-outline">Cancelar</a>
                    </div>
                </form>
            </section>
        </main>
    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
