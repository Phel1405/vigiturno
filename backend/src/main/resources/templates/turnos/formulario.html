<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<div th:replace="~{fragments/head :: head(${modoEdicion} ? 'Editar turno' : 'Nuevo turno')}"></div>
<body>
    <div class="container">
        <div th:replace="~{fragments/navbar-admin :: navbarAdmin}"></div>

        <main>
            <section class="page-header">
                <div>
                    <h2 th:text="${modoEdicion} ? 'Editar turno' : 'Crear nuevo turno'">Turno</h2>
                    <p>Completa la programación del turno de vigilancia.</p>
                </div>

                <div class="actions">
                    <a th:href="@{/turnos}" class="btn btn-outline">Volver al listado</a>
                </div>
            </section>

            <section class="card form-card">
                <form th:action="@{/turnos/guardar}" th:object="${turno}" method="post" class="form-grid">
                    <input type="hidden" th:field="*{id}">

                    <div class="form-group">
                        <label for="fecha">Fecha</label>
                        <input id="fecha" type="date" th:field="*{fecha}" class="input" required>
                    </div>

                    <div class="form-group">
                        <label for="horaInicio">Hora de inicio</label>
                        <input id="horaInicio" type="time" th:field="*{horaInicio}" class="input" required>
                    </div>

                    <div class="form-group">
                        <label for="horaFin">Hora de fin</label>
                        <input id="horaFin" type="time" th:field="*{horaFin}" class="input" required>
                    </div>

                    <div class="form-group">
                        <label for="estado">Estado</label>
                        <select id="estado" th:field="*{estado}" class="select" required>
                            <option value="">Selecciona un estado</option>
                            <option th:each="estado : ${estados}" th:value="${estado}" th:text="${estado}"></option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="usuario">Usuario asignado</label>
                        <select id="usuario" name="usuario" class="select" required>
                            <option value="">Selecciona un usuario</option>
                            <option th:each="usuario : ${usuarios}"
                                    th:value="${usuario.id}"
                                    th:text="${usuario.nombreCompleto + ' - ' + usuario.rol}"
                                    th:selected="${turno.usuario != null and turno.usuario.id == usuario.id}">
                            </option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="zona">Zona asignada</label>
                        <select id="zona" name="zona" class="select" required>
                            <option value="">Selecciona una zona</option>
                            <option th:each="zona : ${zonas}"
                                    th:value="${zona.id}"
                                    th:text="${zona.nombre}"
                                    th:selected="${turno.zona != null and turno.zona.id == zona.id}">
                            </option>
                        </select>
                    </div>

                    <div class="actions">
                        <button type="submit" class="btn btn-primary"
                                th:text="${modoEdicion ? 'Actualizar turno' : 'Guardar turno'}"></button>
                        <a th:href="@{/turnos}" class="btn btn-outline">Cancelar</a>
                    </div>
                </form>
            </section>
        </main>
    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
