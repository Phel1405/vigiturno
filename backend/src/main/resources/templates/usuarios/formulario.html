<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<div th:replace="~{fragments/head :: head(${modoEdicion} ? 'Editar usuario' : 'Nuevo usuario')}"></div>
<body>
    <div class="container">
        <div th:replace="~{fragments/navbar-admin :: navbarAdmin}"></div>

        <main>
            <section class="page-header">
                <div>
                    <h2 th:text="${modoEdicion} ? 'Editar usuario' : 'Crear nuevo usuario'">Usuario</h2>
                    <p>Completa la información básica del usuario.</p>
                </div>

                <div class="actions">
                    <a th:href="@{/usuarios}" class="btn btn-outline">Volver al listado</a>
                </div>
            </section>

            <section class="card form-card">
                <form th:action="@{/usuarios/guardar}" th:object="${usuario}" method="post" class="form-grid">
                    <input type="hidden" th:field="*{id}">

                    <div class="form-group">
                        <label for="nombreCompleto">Nombre completo</label>
                        <input id="nombreCompleto" type="text" th:field="*{nombreCompleto}" class="input" required>
                    </div>

                    <div class="form-group">
                        <label for="correo">Correo</label>
                        <input id="correo" type="email" th:field="*{correo}" class="input" required>
                    </div>

                    <div class="form-group">
                        <label for="password">Contraseña</label>
                        <input id="password" type="text" th:field="*{password}" class="input" required>
                    </div>

                    <div class="form-group">
                        <label for="rol">Rol</label>
                        <select id="rol" th:field="*{rol}" class="select" required>
                            <option value="">Selecciona un rol</option>
                            <option th:each="rol : ${roles}" th:value="${rol}" th:text="${rol}"></option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="activo">Estado</label>
                        <select id="activo" th:field="*{activo}" class="select" required>
                            <option th:value="true">Activo</option>
                            <option th:value="false">Inactivo</option>
                        </select>
                    </div>

                    <div class="actions">
                        <button type="submit" class="btn btn-primary"
                                th:text="${modoEdicion ? 'Actualizar usuario' : 'Guardar usuario'}"></button>
                        <a th:href="@{/usuarios}" class="btn btn-outline">Cancelar</a>
                    </div>
                </form>
            </section>
        </main>
    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
