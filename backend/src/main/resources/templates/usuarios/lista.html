<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<div th:replace="~{fragments/head :: head(${titulo})}"></div>
<body>
    <div class="container">
        <div th:replace="~{fragments/navbar-admin :: navbarAdmin}"></div>

        <main>
            <section class="page-header">
                <div>
                    <h2>Listado de usuarios</h2>
                    <p>Administra docentes, coordinadores y administradores registrados.</p>
                </div>

                <div class="actions">
                    <a th:href="@{/usuarios/nuevo}" class="btn btn-primary">Nuevo usuario</a>
                </div>
            </section>

            <section class="card table-card">
                <div class="table-title">
                    <h2>Usuarios registrados</h2>
                </div>

                <table class="table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nombre completo</th>
                            <th>Correo</th>
                            <th>Rol</th>
                            <th>Estado</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:if="${#lists.isEmpty(usuarios)}">
                            <td colspan="6">No hay usuarios registrados todavía.</td>
                        </tr>

                        <tr th:each="usuario : ${usuarios}">
                            <td th:text="${usuario.id}"></td>
                            <td th:text="${usuario.nombreCompleto}"></td>
                            <td th:text="${usuario.correo}"></td>
                            <td th:text="${usuario.rol}"></td>
                            <td>
                                <span th:if="${usuario.activo}" class="badge badge-success">Activo</span>
                                <span th:unless="${usuario.activo}" class="badge badge-danger">Inactivo</span>
                            </td>
                            <td>
                                <div class="actions">
                                    <a th:href="@{'/usuarios/editar/' + ${usuario.id}}" class="btn btn-outline">Editar</a>
                                    <a th:href="@{'/usuarios/eliminar/' + ${usuario.id}}" class="btn btn-outline"
                                       onclick="return confirm('¿Seguro que deseas eliminar este usuario?');">
                                        Eliminar
                                    </a>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </section>
        </main>
    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
