<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<div th:replace="~{fragments/head :: head('Admin - Zonas')}"></div>
<body>
    <div class="container">
        <div th:replace="~{fragments/navbar :: navbar}"></div>

        <main>
            <section class="page-header">
                <div>
                    <h2>Administración de zonas</h2>
                    <p>Configuración de zonas escolares y espacios de supervisión.</p>
                </div>
                <div class="actions">
                    <a th:href="@{/zonas}" class="btn btn-primary">Abrir CRUD de zonas</a>
                </div>
            </section>

            <section class="card list-panel">
                <h3 class="panel-title">Resumen</h3>
                <div class="simple-list">
                    <div class="simple-list-item">
                        <strong>Zonas operativas</strong>
                        <p>Gestiona patios, comedores, pasillos y demás áreas relevantes.</p>
                    </div>
                </div>
            </section>
        </main>
    </div>
    <div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
