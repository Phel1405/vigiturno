<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<div th:replace="~{fragments/head :: head(${titulo})}"></div>
<body>
    <div class="container">
        <div th:replace="~{fragments/navbar-docente :: navbarDocente}"></div>

        <main class="role-nav-spacer">
            <section class="page-header">
                <div>
                    <h2 th:text="'Turno activo de ' + ${docente.nombreCompleto}">Turno activo</h2>
                    <p>Vista individual del próximo o actual turno del docente seleccionado.</p>
                </div>
                <div class="actions">
                    <a th:href="@{/docente(usuarioId=${docente.id})}" class="btn btn-outline">Volver al dashboard</a>
                </div>
            </section>

            <section th:if="${turnoActivo != null}" class="dashboard-grid">
                <article class="card kpi-card">
                    <p class="kpi-label">Zona</p>
                    <p class="kpi-value" th:text="${turnoActivo.zona.nombre}">Patio</p>
                </article>

                <article class="card kpi-card">
                    <p class="kpi-label">Fecha</p>
                    <p class="kpi-value" th:text="${turnoActivo.fecha}">2026-03-15</p>
                </article>

                <article class="card kpi-card">
                    <p class="kpi-label">Hora inicio</p>
                    <p class="kpi-value" th:text="${turnoActivo.horaInicio}">09:30</p>
                </article>

                <article class="card kpi-card">
                    <p class="kpi-label">Estado</p>
                    <p class="kpi-value" th:text="${turnoActivo.estado}">PENDIENTE</p>
                </article>
            </section>

            <section th:if="${turnoActivo != null}" class="card form-card">
                <div class="form-grid">
                    <div class="form-group">
                        <label>Hora fin</label>
                        <input class="input" th:value="${turnoActivo.horaFin}" readonly>
                    </div>
                    <div class="form-group">
                        <label>Zona asignada</label>
                        <input class="input" th:value="${turnoActivo.zona.nombre}" readonly>
                    </div>
                </div>
            </section>

            <section th:if="${turnoActivo == null}" class="card form-card">
                <div class="simple-list-item">
                    <strong>Sin turnos disponibles</strong>
                    <p>Este docente no tiene turnos asignados actualmente.</p>
                </div>
            </section>
        </main>
    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
