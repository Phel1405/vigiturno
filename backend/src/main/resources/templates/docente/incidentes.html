<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<div th:replace="~{fragments/head :: head(${titulo})}"></div>
<body>
    <div class="container">
        <div th:replace="~{fragments/navbar-docente :: navbarDocente}"></div>

        <main class="role-nav-spacer">
            <section class="page-header">
                <div>
                    <h2 th:text="'Incidentes de ' + ${docente.nombreCompleto}">Incidentes del docente</h2>
                    <p>Consulta y administra incidentes asociados a los turnos del docente seleccionado.</p>
                </div>
                <div class="actions">
                    <a th:href="@{/docente(usuarioId=${docente.id})}" class="btn btn-outline">Volver al dashboard</a>
                    <a th:href="@{/docente/incidentes/nuevo(usuarioId=${docente.id})}" class="btn btn-primary">Nuevo incidente</a>
                </div>
            </section>

            <section class="card table-card">
                <div class="table-title">
                    <h2>Historial de incidentes</h2>
                </div>

                <table class="table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Tipo</th>
                            <th>Severidad</th>
                            <th>Zona</th>
                            <th>Fecha</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:if="${#lists.isEmpty(incidentes)}">
                            <td colspan="6">No hay incidentes asociados a este docente.</td>
                        </tr>
                        <tr th:each="incidente : ${incidentes}">
                            <td th:text="${incidente.id}"></td>
                            <td th:text="${incidente.tipo}"></td>
                            <td th:text="${incidente.severidad}"></td>
                            <td th:text="${incidente.zona.nombre}"></td>
                            <td th:text="${incidente.fechaHora}"></td>
                            <td>
                                <div class="actions">
                                    <a th:href="@{/docente/incidentes/editar/{id}(id=${incidente.id},usuarioId=${docente.id})}" class="btn btn-outline">Editar</a>
                                    <a th:href="@{/docente/incidentes/eliminar/{id}(id=${incidente.id},usuarioId=${docente.id})}"
                                       class="btn btn-outline"
                                       onclick="return confirm('¿Seguro que deseas eliminar este incidente?');">
                                        Eliminar
                                    </a>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </section>
        </main>
    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
