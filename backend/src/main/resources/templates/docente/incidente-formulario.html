<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<div th:replace="~{fragments/head :: head(${titulo})}"></div>
<body>
    <div class="container">
        <div th:replace="~{fragments/navbar-docente :: navbarDocente}"></div>

        <main class="role-nav-spacer">
            <section class="page-header">
                <div>
                    <h2 th:text="'Incidente de ' + ${docente.nombreCompleto}">Formulario de incidente</h2>
                    <p>Registra o actualiza un incidente asociado a un turno del docente.</p>
                </div>
                <div class="actions">
                    <a th:href="@{/docente/incidentes(usuarioId=${docente.id})}" class="btn btn-outline">Volver a incidentes</a>
                </div>
            </section>

            <section class="card form-card">
                <form th:action="@{/docente/incidentes/guardar}" th:object="${incidente}" method="post" class="form-grid">
                    <input type="hidden" name="usuarioId" th:value="${docente.id}">
                    <input type="hidden" th:field="*{id}">

                    <div class="form-group">
                        <label for="tipo">Tipo de incidente</label>
                        <select id="tipo" th:field="*{tipo}" class="select" required>
                            <option value="">Selecciona un tipo</option>
                            <option th:each="tipo : ${tipos}"
                                    th:value="${tipo}"
                                    th:text="${tipo}">
                            </option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="severidad">Severidad</label>
                        <select id="severidad" th:field="*{severidad}" class="select" required>
                            <option value="">Selecciona una severidad</option>
                            <option th:each="sev : ${severidades}"
                                    th:value="${sev}"
                                    th:text="${sev}">
                            </option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="turno">Turno asociado</label>
                        <select id="turno" name="turno" class="select" required>
                            <option value="">Selecciona un turno</option>
                            <option th:each="turno : ${turnos}"
                                    th:value="${turno.id}"
                                    th:text="${turno.fecha + ' · ' + turno.horaInicio + ' · ' + turno.zona.nombre}"
                                    th:selected="${incidente.turno != null and incidente.turno.id == turno.id}">
                            </option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="fechaHora">Fecha y hora</label>
                        <input id="fechaHora" type="datetime-local" th:field="*{fechaHora}" class="input" required>
                    </div>

                    <div class="form-group">
                        <label for="descripcion">Descripción</label>
                        <textarea id="descripcion" th:field="*{descripcion}" class="textarea" placeholder="Describe el incidente" required></textarea>
                    </div>

                    <div class="form-group">
                        <label for="nombreEstudiante">Nombre del estudiante</label>
                        <input id="nombreEstudiante" type="text" th:field="*{nombreEstudiante}" class="input" placeholder="Opcional">
                    </div>

                    <div class="form-group">
                        <label for="cursoEstudiante">Curso del estudiante</label>
                        <input id="cursoEstudiante" type="text" th:field="*{cursoEstudiante}" class="input" placeholder="Opcional">
                    </div>

                    <div class="actions">
                        <button type="submit" class="btn btn-primary">Guardar incidente</button>
                        <a th:href="@{/docente/incidentes(usuarioId=${docente.id})}" class="btn btn-outline">Cancelar</a>
                    </div>
                </form>
            </section>
        </main>
    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
